<!doctype html><html lang="ckb" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاکەل</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf9ff;color:#12364a;font-family:Tahoma,Arial,sans-serif}
header{background:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 14px #1679a51a}
.brand{font-size:24px;font-weight:bold;color:#087eb9}.tag{font-size:12px;color:#7192a3}
main{max-width:850px;margin:22px auto;padding:0 14px}.card{background:#fff;border:1px solid #d4effb;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #0a6a9610}
h2{color:#087eb9;margin:0 0 12px;font-size:20px}input,textarea{display:block;width:100%;padding:12px;border:1px solid #cde7f3;border-radius:11px;margin:8px 0;font:inherit}button,.btn{background:#159bd7;color:#fff;border:0;border-radius:11px;padding:12px 16px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.secondary{background:#e9f7ff;color:#087eb9}.flash{background:#fff5d8;padding:10px;border-radius:10px;margin:8px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.entry{background:#f3fbff;padding:12px;border-radius:12px;margin:8px 0}.small{font-size:13px;color:#68899b}
</style></head><body><header><div><div class="brand">شاکەل</div><div class="tag">SHAKAL FC • بەڕێوەبردنی یانە</div></div>{% if session.get('uid') %}<a class="btn secondary" href="{{url_for('logout')}}">چوونەدەرەوە</a>{% endif %}</header><main>
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main></body></html>
